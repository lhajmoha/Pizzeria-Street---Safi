<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzeria Street - Safi | بيتزا ستريت أسفي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        tajawal: ['Tajawal', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Cairo & Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body {
            font-family: 'Cairo', 'Tajawal', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .dark ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #ea580c;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #c2410c;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body x-data="appData()" :class="darkMode ? 'dark bg-gray-900 text-gray-100' : 'bg-gray-50 text-gray-800'" class="min-h-screen flex flex-col transition-colors duration-300">

    <!-- 1. الهيدر (Header) مع اللوجو في الجانب الأيسر العلوي -->
    <header class="sticky top-0 z-40 backdrop-blur-md bg-white/90 dark:bg-gray-900/90 border-b border-gray-200 dark:border-gray-800 transition-colors shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <!-- الشعار واسم المحل (الجانب الأيمن للغة العربية) -->
                <div class="flex items-center gap-3 cursor-pointer" @click="activeCategory = 'all'">
                    <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-brand-500 shadow-lg shadow-brand-500/30 transform hover:scale-105 transition-transform bg-black flex items-center justify-center">
                        <img src="logo.png" onerror="this.onerror=null; this.src='logo.png.jpg';" alt="Pizzeria Street Logo" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-black tracking-wide bg-gradient-to-r from-brand-600 via-amber-500 to-red-600 bg-clip-text text-transparent">
                            Pizzeria Street
                        </h1>
                        <p class="text-xs font-bold text-gray-500 dark:text-gray-400 flex items-center gap-1">
                            <i class="fa-solid fa-location-dot text-brand-600"></i> أسفي - Safi
                        </p>
                    </div>
                </div>

                <!-- أزرار الإجراءات السريعة + اللوجو المدمج كأفاتار بالجهة اليسرى علوياً -->
                <div class="flex items-center gap-2 sm:gap-4">
                    <!-- زر تبديل الوضع الداكن/الفاتح -->
                    <button @click="toggleDarkMode()" 
                            class="p-2.5 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" 
                            title="تبديل الوضع">
                        <i x-show="!darkMode" class="fa-solid fa-moon text-xl"></i>
                        <i x-show="darkMode" class="fa-solid fa-sun text-xl text-amber-400"></i>
                    </button>

                    <!-- زر لوحة التحكم (Admin) -->
                    <button @click="showAdminModal = true" 
                            class="flex items-center gap-2 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold border border-gray-300 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                        <i class="fa-solid fa-user-shield text-brand-600"></i>
                        <span class="hidden sm:inline">لوحة التحكم</span>
                    </button>

                    <!-- زر السلة -->
                    <button @click="isCartOpen = true" 
                            class="relative flex items-center gap-2 px-4 py-2.5 rounded-xl bg-gradient-to-r from-brand-600 to-amber-500 text-white font-bold shadow-md hover:shadow-lg hover:from-brand-700 hover:to-amber-600 transition-all active:scale-95">
                        <i class="fa-solid fa-basket-shopping text-lg"></i>
                        <span class="hidden sm:inline">السلة</span>
                        <span x-show="cartTotalCount > 0" 
                              x-text="cartTotalCount" 
                              class="absolute -top-2 -left-2 bg-red-600 text-white text-xs font-black rounded-full w-6 h-6 flex items-center justify-center border-2 border-white dark:border-gray-900 shadow-md">
                        </span>
                    </button>

                    <!-- اللوجو العلوي الأيسر كأفاتار بروفايل مميز -->
                    <div class="hidden md:flex items-center pl-2 border-r border-gray-200 dark:border-gray-800 pr-2">
                        <img src="logo.png" onerror="this.onerror=null; this.src='logo.png.jpg';" alt="Logo Avatar" class="w-10 h-10 rounded-full border-2 border-amber-500 shadow-md object-cover hover:rotate-12 transition-transform">
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 2. البانر الرئيسي (Hero Banner) -->
    <section class="relative bg-gray-900 text-white overflow-hidden min-h-[380px] sm:min-h-[460px] flex items-center">
        <div class="absolute inset-0 z-0">
            <img src="banner.jpg" 
                 onerror="this.src='https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=1600&auto=format&fit=crop';" 
                 alt="Pizzeria Street Banner" 
                 class="w-full h-full object-cover object-center transform scale-105 hover:scale-100 transition-transform duration-1000">
            <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-gray-950/70 to-black/40"></div>
        </div>

        <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full text-center sm:text-right">
            <div class="max-w-2xl">
                <span class="inline-flex items-center gap-2 px-3 me-2 py-1 rounded-full bg-brand-600/30 text-brand-400 border border-brand-500/40 text-xs sm:text-sm font-bold mb-4">
                    <i class="fa-solid fa-motorcycle animate-bounce"></i> توصيل سريع لجميع أحياء أسفي
                </span>
                <h2 class="text-3xl sm:text-5xl font-black text-white leading-tight mb-4">
                    أبَنّ وألَذّ بيتزا فـ <span class="text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-brand-500">أسفي</span> بين يديك!
                </h2>
                <p class="text-gray-300 text-sm sm:text-base font-medium mb-6 leading-relaxed">
                    مرحباً بكم في Pizzeria Street. نضمن لكم المذاق الإيطالي الأصيل بعجينة طازجة يومياً وإضافات فاخرة. اطلب الآن ويوصلك طلبك سخون حتى للدار!
                </p>
                <div class="flex flex-wrap gap-4 justify-center sm:justify-start">
                    <a href="#menu" class="px-6 py-3.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold shadow-lg shadow-brand-600/30 transition-all flex items-center gap-2">
                        <i class="fa-solid fa-utensils"></i> استكشف قائمة الطعام
                    </a>
                    <a href="tel:+212625717316" class="px-6 py-3.5 rounded-xl bg-white/10 hover:bg-white/20 backdrop-blur-md text-white border border-white/20 font-bold transition-all flex items-center gap-2">
                        <i class="fa-solid fa-phone text-emerald-400"></i> 0625-717316
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- 3. التبويبات والتصنيفات (Category Tabs) -->
    <main id="menu" class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div class="flex items-center justify-between mb-6">
            <h3 class="text-2xl font-black text-gray-900 dark:text-white flex items-center gap-2">
                <i class="fa-solid fa
